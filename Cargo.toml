[package]
name = "gamemode"
version = "1.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui_plot = "0.29"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Services",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WiFi",
    # Ping ICMP (IcmpCreateFile/IcmpSendEcho) và GetBestRoute để tìm gateway mặc định.
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Icon khay hệ thống + menu chuột phải (tray-icon dùng muda cho menu).
# default-features = false: bỏ backend libappindicator của Linux, chỉ dùng bản Win32.
tray-icon = { version = "0.26", default-features = false }
# Lấy HWND của cửa sổ eframe từ CreationContext (eframe 0.29 dùng raw-window-handle 0.6).
raw-window-handle = "0.6"
# Tự cập nhật OTA: GET manifest + tải bộ cài. HTTPS bằng rustls (feature "tls"; tắt gzip
# vì manifest/bộ cài không nén qua HTTP — server trả file .exe thẳng).
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# Kiểm SHA-256 bộ cài tải về trước khi chạy.
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[build-dependencies]
winres = "0.1.12"
